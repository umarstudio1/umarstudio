<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Dark Card Base -->
  <rect width="512" height="512" rx="120" fill="#09090b"/>
  
  <g stroke-linecap="square">
    <!-- Minimalist 'U' -->
    <path d="M 140 160 V 280 C 140 360, 230 360, 230 280 V 200" 
          fill="none" 
          stroke="url(#silver)" 
          stroke-width="32"/>

    <!-- Minimalist 'S' overlapping -->
    <path d="M 370 200 V 170 C 370 140, 280 140, 280 230 C 280 320, 370 320, 370 370 C 370 420, 280 420, 280 390" 
          fill="none" 
          stroke="url(#cyanAccent)" 
          stroke-width="32"/>
  </g>
  
  <!-- Accent Dots -->
  <circle cx="370" cy="160" r="16" fill="#38bdf8"/>
  <circle cx="140" cy="160" r="16" fill="#ffffff"/>
</svg>
